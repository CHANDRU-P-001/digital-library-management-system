{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}
<section class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-icon">🎓</div>
        <h1>Create an Account</h1>
        <p class="auth-sub">Join the Digital Library for free.</p>

        <form method="POST" action="{{ url_for('register') }}" data-loading="Creating account...">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" minlength="3" maxlength="30"
                       value="{{ username }}" autocomplete="username" required>
                <p class="form-hint">3-30 letters only (no numbers or symbols).</p>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-field">
                    <input type="password" id="password" name="password" minlength="6"
                           autocomplete="new-password" required>
                    <button type="button" class="password-toggle-btn" data-target="password" aria-label="Show password">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path class="eye-path" d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/>
                            <circle class="eye-pupil" cx="12" cy="12" r="3"/>
                            <line class="eye-slash" x1="2" y1="2" x2="22" y2="22" stroke-dasharray="32" stroke-dashoffset="32"/>
                        </svg>
                    </button>
                </div>
                <p class="form-hint">At least 6 characters.</p>
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <div class="password-field">
                    <input type="password" id="confirm_password" name="confirm_password" minlength="6"
                           autocomplete="new-password" required>
                    <button type="button" class="password-toggle-btn" data-target="confirm_password" aria-label="Show password">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path class="eye-path" d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/>
                            <circle class="eye-pupil" cx="12" cy="12" r="3"/>
                            <line class="eye-slash" x1="2" y1="2" x2="22" y2="22" stroke-dasharray="32" stroke-dashoffset="32"/>
                        </svg>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Register</button>
        </form>

        <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
    </div>
</section>
{% endblock %}
