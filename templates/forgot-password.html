{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}

{% block content %}
<section class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-icon">🔑</div>
        <h1>Forgot Password</h1>
        <p class="auth-sub">Enter your username to begin recovering your account.</p>

        <form method="POST" action="{{ url_for('forgot_password') }}" data-loading="Checking...">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Continue</button>
        </form>

        <p class="auth-switch">Remembered it? <a href="{{ url_for('login') }}">Log in</a></p>
    </div>
</section>
{% endblock %}
